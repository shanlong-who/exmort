url: https://shanlong-who.github.io/exmort/
template:
  bootstrap: 5
  bslib:
    primary: '#0093D5'
    base_font:
      google: Source Sans Pro
    heading_font:
      google: Source Sans Pro
    code_font:
      google: JetBrains Mono
home:
  sidebar: false
  title: exmort — All-Cause and Excess Mortality Calculator
  description: >
    Compare observed and expected deaths using weekly or monthly counts.
    Open the browser calculator or run exmort in RStudio to estimate excess deaths and P-scores.
navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
reference:
  - title: Launch the calculator
    desc: Open the calculator and learn about the package.
    contents: [run_app, exmort-package]
articles:
  - title: Work with exmort
    navbar: ~
    contents:
      - exmort
      - data-preparation
      - models-and-interpretation
authors:
  Shanlong Ding:
    href: https://github.com/shanlong-who
