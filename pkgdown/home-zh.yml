"Six months of mortality": "六个月的死亡人数"
"Observed deaths": "实际死亡人数"
"Expected deaths": "预期死亡人数"
"Monthly observed deaths rise from 980 in January to 1,230 in April, then fall to 1,060 in June. The expected baseline stays at 1,000.": "实际死亡人数从 1 月的 980 人升至 4 月的 1,230 人，随后降至 6 月的 1,060 人。各月预期死亡人数均为 1,000 人。"
"April excess deaths": "4 月超额死亡人数"
"April P-score": "4 月 P-score"
"In April, 1,230 deaths were observed and 1,000 were expected. The difference was 23% of the expected count.": "4 月实际死亡 1,230 人，预期死亡 1,000 人。多出的 230 人相当于预期人数的 23%，这就是该月的 P-score。"
"See how the P-score is calculated": "查看 P-score 的计算方法（英文）"
"From a workbook to a report": "从数据工作簿到分析报告"
"Prepare the data": "准备数据（英文）"
"Match weekly or monthly death counts to an event calendar. Check dates, missing counts and which periods will form the baseline.": "将每周或每月的死亡人数与事件日历对齐。核对日期和缺失值，确认哪些时段将用于估计基线。"
"Compare baselines": "比较基线模型（英文）"
"Explore seven all-cause models, from historical averages to seasonal regression. Read the uncertainty alongside the estimated excess.": "比较历史平均法、季节性回归等七种全因死亡模型。解读超额死亡估计时，同时查看不确定性区间。"
