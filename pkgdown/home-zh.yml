"How different was mortality during a heatwave, outbreak or other event? Use weekly or monthly death counts to estimate a baseline and see how far recorded deaths were above or below it.": "热浪或疫情期间，实际死亡人数比平时多了多少？用每周或每月的死亡数据估计基线，就能看出实际死亡人数比预期多了或少了多少。"
